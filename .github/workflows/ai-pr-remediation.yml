name: AI PR Remediation Loop

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  remediate:
    # Trigger only if explicitly requested or on changes requested by human reviewers
    if: >
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/ai-fix'))
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Bot Loops
        if: github.actor == 'github-actions[bot]'
        run: exit 0

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node / Python Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Context and Diff
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Capture unified diff against base branch
          git fetch origin ${{ github.event.pull_request.base.ref || 'main' }}
          git diff origin/${{ github.event.pull_request.base.ref || 'main' }}...HEAD > pr_diff.patch

          # Dump review feedback or comment into a context file
          echo "${{ github.event.review.body || github.event.comment.body }}" > feedback.txt

      - name: Call Gemini API (AI Studio)
        id: ai_studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node .github/scripts/ai-remediate.mjs

      - name: Commit and Push Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "fix(ai): address review comments and feedback"
            git push origin HEAD
          else
            echo "No changes generated by AI Studio."
          fi