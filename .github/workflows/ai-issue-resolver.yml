name: AI Issue Resolver & Automated PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: writename: AI Issue Resolver (Staging Batch)

on:
  issues:
    types: [opened, labeled]

# Queue runs sequentially so multiple issues don't collide on ai-staging
concurrency:
  group: ai-staging-branch
  cancel-in-progress: false

env:
  TARGET_BRANCH: ai-staging

permissions:
  contents: write
  issues: write

jobs:
  resolve-issue:
    if: contains(github.event.issue.labels.*.name, 'ai-task') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest

    steps:
      - name: Debug Event Payload
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Author Association: ${{ github.event.issue.author_association }}"
          echo "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"
          echo "Target Branch: ${{ env.TARGET_BRANCH }}"

      - name: Checkout Staging Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Self-Healing AI Resolution Script
        id: agent_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/agent-runner.mjs

      - name: Notify Failure on Test Breakdown
        if: failure() && steps.agent_run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **AI Automated Resolution Failed**: The agent exhausted all retry attempts and could not pass verification checks (\`npm test\`). No changes were pushed to \`${process.env.TARGET_BRANCH}\`. Check the workflow run logs for details.`
            });

      - name: Commit and Push to Staging Branch
        id: git_push
        if: success()
        run: |
          git config user.name "AI Issue Resolver"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(agent): automated remediation for #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          git push origin ${{ env.TARGET_BRANCH }}
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Notify Success on Issue
        if: success() && steps.git_push.outputs.sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Resolved on \`${process.env.TARGET_BRANCH}\`** (commit \`${{ steps.git_push.outputs.sha }}\`). All \`npm test\` checks passed and changes are staged for batch PR review.`
            });
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    if: contains(github.event.issue.labels.*.name, 'ai-task')
    runs-on: ubuntu-latest

    steps:
      - name: Debug Event Payload
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Self-Healing AI Resolution Script
        id: agent_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/agent-runner.mjs

      - name: Notify Failure on Test Breakdown
        if: failure() && steps.agent_run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **AI Automated Resolution Failed**: The agent exhausted all retry attempts and could not pass verification checks (\`npm test\`). No Pull Request was opened. Check the workflow run logs for compiler or runtime details.`
            });

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          commit-message: "fix(agent): automated remediation for #${{ github.event.issue.number }}"
          branch: "ai-fix/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "🤖 Fix: ${{ github.event.issue.title }}"
          body: |
            ### Automated AI Remediation
            Closes #${{ github.event.issue.number }}

            **Implemented Fix:**
            This Pull Request was autonomously generated using Gemini and verified via the internal self-healing test loop.
            All automated tests (\`npm test\`) passed cleanly before branch submission.
          labels: "automated-pr, ready-for-review"