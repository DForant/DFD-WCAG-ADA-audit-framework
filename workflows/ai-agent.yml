name: AI Studio Agent Developer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    # Only execute if the applied label is exactly 'ai-issue'
    if: github.event.label.name == 'ai-issue'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        # Essential for Linux runners running axe-core Playwright
        run: npx playwright install --with-deps chromium

      - name: Acknowledge Issue with Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **AI Agent Activated:** Processing issue requirements against `PROJECT_REQUIREMENTS.md` and creating a PR for review.'
            });

      - name: Execute AI Implementation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # or ANTHROPIC_API_KEY
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node scripts/run-agent-task.js

      - name: Create Pull Request for Human Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: automated resolution for issue #${{ github.event.issue.number }}"
          title: "fix(ai): resolve issue #${{ github.event.issue.number }} -${{ github.event.issue.title }}"
          body: |
            Automated implementation for issue #${{ github.event.issue.number }}.
            
            **Review Checklist:**
            - [ ] Code follows `PROJECT_REQUIREMENTS.md`
            - [ ] Playwright tests pass cleanly
            - [ ] Ready to merge into `main`
          branch: "ai/issue-${{ github.event.issue.number }}"
          base: main
          delete-branch: true